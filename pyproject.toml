[project]
name = "hashtag-motoboys"
version = "0.1.0"
description = "Agente de WhatsApp que cuida dos motoboys do Grupo HASHTAG"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "supabase>=2.10",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
